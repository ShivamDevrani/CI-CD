# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Deply to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Buliding Docker image
      run:  docker build -t ${{secrets.DOCKER_USER}}/myapp:latest .

    - name: Login to Dockerhub
      run: echo "${{secrets.DOCKER_TOKEN}}"| docker login -u ${{secrets.DOCKER_USER}} --password-stdin

    - name: Push to Docker hub
      run: docker push ${{secrets.DOCKER_USER}}/myapp:latest

  deploy_to_ec2:

    runs-on: ubuntu-latest
    needs: "build-and-push"

    steps:
       - name: SSH into EC2 and Deploy
         uses: appleboy/ssh-action@v1.0.3
         with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              echo "Successfully logged into EC2!"
              docker pull ${{ secrets.DOCKER_USER }}/myapp:latest
              docker stop myapp || true
              docker rm myapp || true
              docker run -d -p 3000:3000 -e PORT=${{secrets.PORT}} --name myapp  ${{ secrets.DOCKER_USER }}/myapp:latest 
